<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metronome</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">&#9833; METRONOME</h1>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav" role="tablist">
      <button class="tab-btn active" data-tab="metronome" role="tab">Metronome</button>
      <button class="tab-btn" data-tab="rhythm" role="tab">Rhythm Buddy</button>
    </nav>

    <!-- ══════════════════════════════
         METRONOME TAB
    ══════════════════════════════ -->
    <div id="tab-metronome" class="tab-panel active">

      <!-- Beat Visualizer + Count-In Overlay -->
      <section class="beat-vis-wrapper" aria-label="Beat indicators">
        <div class="beat-visualizer" id="beat-visualizer"></div>
        <div class="count-in-display" id="count-in-display">
          <div class="count-in-num" id="count-in-num"></div>
        </div>
      </section>

      <!-- BPM Section -->
      <section class="bpm-section">
        <div class="bpm-display">
          <button class="bpm-nudge" id="bpm-down" aria-label="Decrease BPM">&#8722;</button>
          <div class="bpm-value-group">
            <input type="number" id="bpm-input" class="bpm-number"
                   min="40" max="240" value="120" aria-label="BPM value" />
            <span class="bpm-label">BPM</span>
          </div>
          <button class="bpm-nudge" id="bpm-up" aria-label="Increase BPM">+</button>
        </div>
        <input type="range" id="bpm-slider" class="bpm-slider"
               min="40" max="240" value="120" aria-label="BPM slider" />
        <div class="bpm-range-labels"><span>40</span><span>240</span></div>
      </section>

      <!-- Controls -->
      <section class="controls-section">

        <div class="control-group">
          <label class="control-label">Note Value</label>
          <div class="btn-group" id="note-group" role="group" aria-label="Note value">
            <button class="seg-btn active" data-subdivision="1" title="Quarter notes">&#9833;</button>
            <button class="seg-btn"        data-subdivision="2" title="Eighth notes">&#9834;</button>
            <button class="seg-btn"        data-subdivision="4" title="Sixteenth notes">&#9836;</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Time Signature</label>
          <div class="btn-group" id="timesig-group" role="group" aria-label="Time signature">
            <button class="seg-btn"        data-upper="2" data-lower="4">2/4</button>
            <button class="seg-btn"        data-upper="3" data-lower="4">3/4</button>
            <button class="seg-btn active" data-upper="4" data-lower="4">4/4</button>
            <button class="seg-btn"        data-upper="6" data-lower="8">6/8</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Sound</label>
          <div class="btn-group" id="sound-group" role="group" aria-label="Sound type">
            <button class="seg-btn active" data-sound="click">Click</button>
            <button class="seg-btn"        data-sound="wood">Wood</button>
            <button class="seg-btn"        data-sound="beep">Beep</button>
            <button class="seg-btn"        data-sound="hihat">Hi-Hat</button>
          </div>
        </div>

      </section>

      <!-- Accent Toggle -->
      <section class="accent-section">
        <label class="toggle-row">
          <span class="toggle-label-text">Accent beat 1</span>
          <span class="toggle-switch">
            <input type="checkbox" id="accent-enabled" checked />
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </section>

      <!-- Ramp Section -->
      <section class="ramp-section">
        <div class="ramp-header">
          <span class="control-label">Tempo Ramp</span>
          <label class="toggle-switch">
            <input type="checkbox" id="ramp-enabled" />
            <span class="toggle-thumb"></span>
          </label>
        </div>
        <div class="ramp-controls" id="ramp-controls">
          <div class="ramp-fields">
            <div class="ramp-field">
              <label for="ramp-start-bpm">From</label>
              <input type="number" id="ramp-start-bpm" min="40" max="240" value="80" />
              <span>BPM</span>
            </div>
            <div class="ramp-arrow">&#8594;</div>
            <div class="ramp-field">
              <label for="ramp-end-bpm">To</label>
              <input type="number" id="ramp-end-bpm" min="40" max="240" value="140" />
              <span>BPM</span>
            </div>
            <div class="ramp-field">
              <label for="ramp-measures">Over</label>
              <input type="number" id="ramp-measures" min="1" max="64" value="8" />
              <span>measures</span>
            </div>
          </div>
          <div class="ramp-progress-bar">
            <div class="ramp-progress-fill" id="ramp-progress-fill"></div>
          </div>
        </div>
      </section>

      <!-- Action Buttons -->
      <section class="action-section">
        <button class="btn-tap" id="tap-tempo-btn" aria-label="Tap tempo">TAP</button>
        <button class="btn-play" id="play-pause-btn" aria-label="Start metronome">
          <span class="play-icon">&#9654;</span>
          <span class="pause-icon" style="display:none">&#9646;&#9646;</span>
          <span class="btn-label">START</span>
        </button>
      </section>

    </div><!-- /#tab-metronome -->

    <!-- ══════════════════════════════
         RHYTHM BUDDY TAB
    ══════════════════════════════ -->
    <div id="tab-rhythm" class="tab-panel">

      <!-- Current Pattern Name -->
      <div class="rhythm-header">
        <div class="rhythm-pattern-name" id="rhythm-pattern-name">Rock Basic</div>
        <div class="rhythm-pattern-cat" id="rhythm-pattern-cat">Rock</div>
      </div>

      <!-- Beat Visualizer -->
      <div class="rb-vis-wrapper">
        <!-- Step position track (16 dots) -->
        <div class="rb-step-track" id="rb-step-track"></div>
        <!-- Instrument rows -->
        <div class="rb-instr-rows" id="rb-instr-rows"></div>
        <!-- Count-in overlay -->
        <div class="count-in-display" id="rb-count-in-display">
          <div class="count-in-num" id="rb-count-in-num"></div>
        </div>
      </div>

      <!-- Category Filter -->
      <div class="cat-filter" id="cat-filter">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="Rock">Rock</button>
        <button class="cat-btn" data-cat="Blues">Blues</button>
        <button class="cat-btn" data-cat="Jazz">Jazz</button>
        <button class="cat-btn" data-cat="Funk">Funk</button>
        <button class="cat-btn" data-cat="Latin">Latin</button>
        <button class="cat-btn" data-cat="Other">Other</button>
      </div>

      <!-- Pattern Grid -->
      <div class="pattern-grid" id="pattern-grid"></div>

      <!-- Tempo Feel -->
      <div class="control-group">
        <label class="control-label">Tempo Feel</label>
        <div class="btn-group" id="feel-group">
          <button class="seg-btn active" data-feel="straight">Straight</button>
          <button class="seg-btn"        data-feel="shuffle">Shuffle</button>
          <button class="seg-btn"        data-feel="swing">Swing</button>
        </div>
      </div>

      <!-- Volume -->
      <div class="control-group">
        <label class="control-label">Volume</label>
        <input type="range" id="rb-volume" class="bpm-slider"
               min="0" max="100" value="80" style="--slider-pct:80%" />
      </div>

      <!-- Play Button -->
      <section class="action-section">
        <button class="btn-play" id="rb-play-btn" aria-label="Start rhythm">
          <span class="play-icon">&#9654;</span>
          <span class="pause-icon" style="display:none">&#9646;&#9646;</span>
          <span class="btn-label">START</span>
        </button>
      </section>

    </div><!-- /#tab-rhythm -->

  </div><!-- /.app -->

  <script src="metronome.js"></script>
  <script src="rhythm.js"></script>
</body>
</html>
